# Health check: proves the cloud can run V4 code and reach Maaz's phone.
# Runs every Monday, when this file or the alert code changes, and on demand.
# Also counts this month's Actions minutes and warns past 1,500 of the free 2,000.
name: Health check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"   # Monday 08:47 IST
  push:
    branches: [main]
    paths:
      - .github/workflows/health_check.yml
      - v4/alerts.py

permissions:
  contents: read
  actions: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run checks
        run: python -m pytest -q
      - name: Check Actions minutes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m v4.jobs.actions_minutes
      - name: Send test alert
        if: ${{ github.event_name != 'schedule' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m v4.alerts "✅ V4 is alive. Cloud → Telegram works. (Health check, run ${{ github.run_number }})"
      - name: Alert on any failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m v4.alerts "❌ V4 job FAILED: ${{ github.workflow }} (run ${{ github.run_number }}). Open GitHub → Actions for details."
