# Health check: proves the cloud can run V4 code and reach Maaz's phone.
# Runs when this file or the alert code changes, and on demand (Actions tab → Run workflow).
name: Health check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/health_check.yml
      - v4/alerts.py

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run checks
        run: python -m pytest -q
      - name: Send test alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m v4.alerts "✅ V4 is alive. Cloud → Telegram works. (Health check, run ${{ github.run_number }})"
