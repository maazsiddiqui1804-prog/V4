# Trading Engine backtest of the current rules (B2, D-137). Manual. Uses the prices branch. Results are SIMULATION, never live.
name: Trading backtest

on:
  workflow_dispatch:
    inputs:
      refresh_prices:
        description: "Download fresh prices first (yes/no)"
        default: "no"

permissions:
  contents: write

concurrency:
  group: database-writes
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Use the daily-updated price history (prices branch)
        run: |
          git fetch -q origin prices
          mkdir -p data/prices
          git show origin/prices:india_daily.csv.gz > data/prices/india_daily.csv.gz
          git show origin/prices:nifty500_index.csv > data/prices/nifty500_index.csv
      - name: Download India prices instead (only if asked)
        if: ${{ inputs.refresh_prices == 'yes' }}
        run: python -m v4.importers.india_prices
      - name: Run backtest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m v4.jobs.backtest
      - name: Save results to the repo (prices live on the prices branch)
        run: |
          git config user.name "V4 bot"
          git config user.email "v4-bot@users.noreply.github.com"
          git add data/backtest
          git diff --cached --quiet || git commit -m "Backtest $(date +%F)"
          git pull --rebase -q && git push
      - name: Alert on any failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m v4.alerts "❌ V4 job FAILED: ${{ github.workflow }} (run ${{ github.run_number }}). Open GitHub → Actions for details."
