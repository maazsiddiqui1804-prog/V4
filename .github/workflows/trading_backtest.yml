# Trading Engine backtest (D-047/D-048 groundwork). Manual. Results are SIMULATION, never live.
name: Trading backtest

on:
  workflow_dispatch:
    inputs:
      refresh_prices:
        description: "Download fresh prices first (yes/no)"
        default: "yes"

permissions:
  contents: write

concurrency:
  group: database-writes
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Download India prices
        if: ${{ inputs.refresh_prices == 'yes' }}
        run: python -m v4.importers.india_prices
      - name: Run backtest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m v4.jobs.backtest
      - name: Save prices and results to the repo
        run: |
          git config user.name "V4 bot"
          git config user.email "v4-bot@users.noreply.github.com"
          git add data/prices data/backtest
          git diff --cached --quiet || git commit -m "Backtest $(date +%F)"
          git pull --rebase -q && git push
      - name: Alert on any failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m v4.alerts "❌ V4 job FAILED: ${{ github.workflow }} (run ${{ github.run_number }}). Open GitHub → Actions for details."
