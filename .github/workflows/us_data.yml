# US data (D-096): SEC EDGAR. Manual runs for now; scheduled once the US module is built.
name: US data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe, universe, fundprobe, fundamentals, shortlist, prices, rank"
        default: probe
      tickers:
        description: "probe: comma-separated tickers"
        default: ""

permissions:
  contents: write

concurrency:
  group: database-writes
  cancel-in-progress: false

jobs:
  us:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Probe SEC industry codes
        if: ${{ inputs.mode == 'probe' }}
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: python -m v4.importers.sec probe "${{ inputs.tickers }}"
      - name: Probe SEC financials
        if: ${{ inputs.mode == 'fundprobe' }}
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: python -m v4.engines.us.fundamentals probe "${{ inputs.tickers }}"
      - name: Build US universe
        if: ${{ inputs.mode == 'universe' }}
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m v4.engines.us.universe
      - name: Save universe to the repo
        if: ${{ inputs.mode == 'universe' }}
        run: |
          git config user.name "V4 bot"
          git config user.email "v4-bot@users.noreply.github.com"
          git add data/us_universe.csv
          git diff --cached --quiet || git commit -m "US universe $(date +%F)"
          git pull --rebase -q && git push
      - name: US monthly stage
        if: ${{ contains(fromJSON('["fundamentals","shortlist","prices","rank"]'), inputs.mode) }}
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m v4.jobs.us_monthly "${{ inputs.mode }}"
      - name: Save US results to the repo
        if: ${{ contains(fromJSON('["fundamentals","shortlist","prices","rank"]'), inputs.mode) }}
        run: |
          git config user.name "V4 bot"
          git config user.email "v4-bot@users.noreply.github.com"
          git add data/us
          git diff --cached --quiet || git commit -m "US ${{ inputs.mode }} $(date +%F)"
          git pull --rebase -q && git push
      - name: Alert on any failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m v4.alerts "❌ V4 job FAILED: ${{ github.workflow }} (run ${{ github.run_number }}). Open GitHub → Actions for details."
