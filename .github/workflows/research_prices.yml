# Research only: long price history for strategy testing. Saved on branch research-data, never on main.
name: Research prices

on:
  workflow_dispatch:
    inputs:
      period:
        description: "Yahoo period, e.g. 15y or max"
        default: "15y"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Download long history
        run: python -m v4.importers.india_prices "${{ inputs.period }}" research
      - name: Save to the research-data branch (kept off main)
        run: |
          git config user.name "V4 bot"
          git config user.email "v4-bot@users.noreply.github.com"
          git checkout --orphan research-data
          git rm -rq --cached .
          git add research/
          git commit -qm "Research prices ${{ inputs.period }} $(date +%F)"
          git push -f origin research-data
      - name: Alert on any failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m v4.alerts "❌ V4 job FAILED: ${{ github.workflow }} (run ${{ github.run_number }}). Open GitHub → Actions for details."
