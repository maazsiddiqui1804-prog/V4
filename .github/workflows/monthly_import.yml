# Monthly India import (D-118): runs when Maaz drops a Screener export into data/inbox/.
# Can also be started by hand: Actions tab → Monthly import → Run workflow.
name: Monthly import

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/inbox/*.csv"

permissions:
  contents: write   # to commit the updated database and archive

concurrency:
  group: database-writes   # never two jobs writing the database at once
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Import
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m v4.jobs.monthly_import
      - name: Save results to the repo
        run: |
          git config user.name "V4 bot"
          git config user.email "v4-bot@users.noreply.github.com"
          git add -A data/
          git diff --cached --quiet || git commit -m "Monthly import $(date +%F)"
          git push
      - name: Alert on any failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m v4.alerts "❌ V4 job FAILED: ${{ github.workflow }} (run ${{ github.run_number }}). Open GitHub → Actions for details."
