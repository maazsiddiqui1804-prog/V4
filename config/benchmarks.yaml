# Benchmarks (D-095 targets, D-121 source: index-fund NAVs from AMFI).
# scheme_codes are filled in only after Maaz approves which funds to track.
# match/exclude are used by `discover` to list candidate funds.
benchmarks:
  nifty500:
    label: "Nifty 500 (India benchmark, kill test D-064)"
    match: "nifty\\s*500\\s*index"
    exclude: "momentum|value|quality|multicap|equal|low vol|shariah|largemidsmall|healthcare|flexicap"
    scheme_codes: []
  quality30:
    label: "Nifty200 Quality 30 (quality bar, kill test D-064)"
    match: "nifty\\s*200\\s*quality\\s*30"
    scheme_codes: []
  momentum30:
    label: "Nifty200 Momentum 30 (diagnostic only, D-107)"
    match: "nifty\\s*200\\s*momentum\\s*30"
    scheme_codes: []
  nasdaq100:
    label: "Nasdaq-100 in INR (US benchmark)"
    match: "nasdaq\\s*100"
    exclude: "equal|top\\s*15|q50"
    scheme_codes: []
