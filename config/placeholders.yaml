# Every untested number in V4. Each is a PLACEHOLDER until testing backs it and Maaz re-approves.
# null = no starting value approved yet; set during the build and approved by Maaz (tasks T-029, T-047).
# No secrets here.

investment:
  kill_filters:            # D-023; starting values approved 2026-11-09 ("Balanced", D-123)
    # Loss check is fixed by D-116: no loss in last year, year before, or trailing 12 months.
    max_debt_equity: 1.5             # PLACEHOLDER
    min_interest_cover: 3.0          # PLACEHOLDER; skipped when debt_equity < near_zero_debt
    near_zero_debt: 0.1              # PLACEHOLDER; below this D/E, interest cover isn't checked
    max_promoter_pledge_pct: 10      # PLACEHOLDER
    min_cash_conversion: 0.7         # PLACEHOLDER; 2-year: (CFO last + preceding) / (net profit last + preceding)
    blank_means_fail: true           # approved: never buy what can't be checked
  score_weights:           # D-099, D-103
    normal: {quality: 40, growth: 30, momentum: 30}
    weak_market: {quality: 55, growth: 30, momentum: 15}
  momentum_lookback: "blend 6m + 12m"  # D-099 PLACEHOLDER; chosen 2026-11-09 (D-124)
  valuation:
    india_pe_basis: historical_pe_10years   # D-025; chosen 2026-11-09 (D-125). Falls back to 5-year if blank
    india_pe_margin: 0.20  # D-025 PLACEHOLDER (D-125): may pay up to 10-yr P/E × 1.2
    india_max_peg: 2.0     # D-025 second check PLACEHOLDER (D-125); blank or negative PEG = fail
    us_peg_threshold: null # D-101
  min_buy_inr: 10000       # D-105 (approved, not a placeholder; kept here for one place to look)

trading:
  liquidity_floor_cr_per_day: 20   # D-040 (~₹20 cr)
  volume_multiple: 1.5             # D-042
  max_stretch_above_20dma: null    # D-042
  trail_method: null               # D-045
  drawdown_brake_pct: 15           # D-104
  stepdown_rule: null              # D-100
