# Every untested number in V4. Each is a PLACEHOLDER until testing backs it and Maaz re-approves.
# null = no starting value approved yet; set during the build and approved by Maaz (tasks T-029, T-047).
# No secrets here.

investment:
  kill_filters:            # D-023; starting values approved 2026-11-09 ("Balanced", D-123)
    # Loss check is fixed by D-116: no loss in last year, year before, or trailing 12 months.
    max_debt_equity: 1.5             # PLACEHOLDER
    min_interest_cover: 3.0          # PLACEHOLDER; skipped when debt_equity < near_zero_debt
    near_zero_debt: 0.1              # PLACEHOLDER; below this D/E, interest cover isn't checked
    max_promoter_pledge_pct: 10      # PLACEHOLDER
    min_cash_conversion: 0.7         # PLACEHOLDER; 2-year: (CFO last + preceding) / (net profit last + preceding)
    blank_means_fail: true           # approved: never buy what can't be checked
  score_weights:           # D-099, D-103
    normal: {quality: 40, growth: 30, momentum: 30}
    weak_market: {quality: 55, growth: 30, momentum: 15}
  momentum_lookback: "blend 6m + 12m"  # D-099 PLACEHOLDER; chosen 2026-11-09 (D-124)
  valuation:
    india_pe_basis: historical_pe_10years   # D-025; chosen 2026-11-09 (D-125). Falls back to 5-year if blank
    india_pe_margin: 0.20  # D-025 PLACEHOLDER (D-125): may pay up to 10-yr P/E × 1.2
    india_max_peg: 2.0     # D-025 second check PLACEHOLDER (D-125); blank or negative PEG = fail
    us_peg_threshold: null # D-101
  min_buy_inr: 10000       # D-105 (approved, not a placeholder; kept here for one place to look)
  portfolio:               # D-028, D-060, D-092, D-105, D-126 (approved 2026-11-09)
    monthly_amount_inr: 25000          # D-126 standing default; override per month via Run workflow
    first_brief_month: "2026-12"       # Maaz 2026-11-09: no real brief/freeze before December (after GMAT)
    target_holdings: 15                # D-028 India
    max_names_per_month: 5             # D-105
    max_rank: 100                      # never buy below rank 100 (would be sold next month, D-027)
    max_per_sector_while_filling: 3    # D-126
    pct_caps_from_holdings: 10         # D-126: % caps switch on at 10+ holdings
    stock_cap: 0.10                    # D-060
    sector_cap: 0.25                   # D-060
  sells:                   # D-027, D-028, D-061, D-127 (approved 2026-11-09)
    quality_bottom_fraction: 0.25      # D-127: quality score in bottom quarter of survivors = sell (PLACEHOLDER)
    trim_above_x_target: 2.0           # D-028
    trim_to_x_target: 2.0              # D-127: trim only the excess above 2× target

trading:                   # Trading Engine = "B2" (D-137, approved 2026-11-10 from the strategy search,
                           # research/2026-11-strategy-search). Numbers stay PLACEHOLDER until paper trading proves them.
  capital_inr: 100000              # D-098 paper notional
  liquidity_floor_cr_per_day: 20   # D-040 (~₹20 cr) — 20-day average traded value
  trend_fast_dma: 50               # D-042: 50-day average above 200-day, price above 50-day
  trend_slow_dma: 200
  rs_top_fraction: 0.20            # top 20% relative strength
  rs_lookback_days: 252            # D-137: 12-month return…
  rs_skip_days: 21                 # …skipping the latest month
  breakout_days: 250               # D-137: close above the highest close of the previous 250 days (52-week high)
  volume_multiple: 1.5             # D-042 ≥1.5× 20-day average volume
  max_stretch_above_20dma: null    # D-137: no stretch limit
  stop_method: atr                 # D-137: stop = signal close − 2 × 14-day average true range
  stop_atr_multiple: 2.0
  stop_lookback_days: 10           # only used if stop_method: lowest_low
  stop_buffer: 0.005               # only used if stop_method: lowest_low
  max_initial_risk: 0.15           # skip if the stop is >15% below entry
  partial_at_r: null               # D-137: no profit target — let winners run
  partial_fraction: 0.5
  trail_dma: 50                    # D-137: exit next morning after a close below the 50-day average
  trail_after_partial: false       # trail is active from day one
  time_stop_days: 250              # D-137: at most ~1 year
  weak_market_action: no_new_entries   # D-137: Nifty 500 below its 200-day average → no new trades (open ones keep their exits)
  risk_per_trade: 0.01             # D-044 1% of trading capital
  weak_market_risk: 0.005          # only used if weak_market_action: half_size
  max_open: 6                      # D-046
  max_per_sector: 3                # D-046
  results_blackout_days: 5         # D-046 (needs results calendar; not applied in backtest)
  slippage: 0.001                  # D-047 PLACEHOLDER 0.1% each side
  drawdown_brake_pct: 15           # D-104
  stepdown_rule: null              # D-100 (set after live trades exist)

us:                        # US Investment Engine. ALL values PROVISIONAL — awaiting Maaz's approval (Waiting on you).
  approved: false          # while false, the US brief shows rankings but no US buy orders
  kill_filters:            # D-023 applied to US; proposed = India's D-123 values
    max_debt_equity: 1.5
    min_interest_cover: 3.0
    near_zero_debt: 0.1
    min_cash_conversion: 0.7          # 3-year
  shortlist_size: 40                  # D-136
  weights: {quality: 40, growth: 30, momentum: 30}   # D-099; US weak-market switch not defined yet
  max_peg: 2.0                        # D-101 US guardrail threshold — proposed = India's D-125
  fallback_months: 3                  # D-102: 3 blocked months -> Nasdaq-100 fund
  target_holdings: 6                  # D-028 says 5–8
  compliance:              # D-132 safeguards (warnings only)
    tcs_threshold_inr: 1000000        # PLACEHOLDER: LRS TCS threshold per financial year; RE-VERIFY under Income-tax Act 2025 before first transfer
    tcs_warn_fraction: 0.8            # warn at 80% of the threshold
    estate_warn_usd: 45000            # D-132: warn at ~$45k (US estate tax applies above $60k)
    w8ben_remind_days: 60
    w8ben_signed: null                # set to the signing date (YYYY-MM-DD) once Maaz submits W-8BEN (T-058)

tax:                       # India listed-share capital gains, for ESTIMATES only (v4/engines/tax.py)
  stcg_rate: 0.20                    # checked 2026-11-10 (Finance (No. 2) Act 2024 rates); RE-VERIFY under Income-tax Act 2025
  ltcg_rate: 0.125
  ltcg_exempt_inr: 125000
  cess: 0.04
  long_term_days: 365                # held more than 12 months = long-term
